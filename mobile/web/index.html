<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="club_connect">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>club_connect</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    #real-camera-modal {
      position: fixed;
      inset: 0;
      z-index: 999999;
      background: rgba(12, 8, 5, 0.94);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #FAF6F0;
    }
    #camera-feed-box {
      position: relative;
      width: 100%;
      max-width: 440px;
      height: 320px;
      background: #000;
      border: 2px solid #DDB892;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 25px 60px rgba(0,0,0,0.85), 0 0 35px rgba(184, 125, 75, 0.35);
    }
    #scanner-laser {
      position: absolute;
      left: 16px;
      right: 16px;
      height: 3px;
      background: #34d399;
      box-shadow: 0 0 16px #34d399;
      animation: sweepLaser 1.5s infinite alternate ease-in-out;
      z-index: 10;
    }
    @keyframes sweepLaser {
      from { top: 20px; }
      to { top: 290px; }
    }
  </style>
</head>
<body>
  <!-- Real Webcam Full-Screen Scanner Overlay -->
  <div id="real-camera-modal">
    <div style="max-width: 440px; width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px;">
      <div style="display: flex; align-items: center; gap: 10px;">
        <span style="font-size: 22px;">📷</span>
        <div>
          <div style="font-weight: 800; font-size: 15px; letter-spacing: 0.3px;">GL Bajaj Real ID Card Scanner</div>
          <div style="font-size: 11px; color: #DDB892;">Hold your physical card (QR or Barcode) to the webcam</div>
        </div>
      </div>
      <button onclick="stopRealCameraScan()" style="background: #2A1C14; border: 1px solid #432F23; color: #D4C7B8; border-radius: 50%; width: 34px; height: 34px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px;">✕</button>
    </div>

    <div id="camera-feed-box">
      <video id="live-camera-video" style="width: 100%; height: 100%; object-fit: cover;" autoplay playsinline muted></video>
      <div id="scanner-laser"></div>
      
      <!-- Viewfinder Accents -->
      <div style="position: absolute; top: 12px; left: 12px; width: 24px; height: 24px; border-top: 3px solid #DDB892; border-left: 3px solid #DDB892; z-index: 10;"></div>
      <div style="position: absolute; top: 12px; right: 12px; width: 24px; height: 24px; border-top: 3px solid #DDB892; border-right: 3px solid #DDB892; z-index: 10;"></div>
      <div style="position: absolute; bottom: 12px; left: 12px; width: 24px; height: 24px; border-bottom: 3px solid #DDB892; border-left: 3px solid #DDB892; z-index: 10;"></div>
      <div style="position: absolute; bottom: 12px; right: 12px; width: 24px; height: 24px; border-bottom: 3px solid #DDB892; border-right: 3px solid #DDB892; z-index: 10;"></div>
    </div>

    <div style="margin-top: 14px; display: flex; gap: 10px; width: 100%; max-width: 440px;">
      <button onclick="document.getElementById('card-image-file').click()" style="flex: 1; padding: 12px; background: #2A1C14; border: 1.5px solid #DDB892; color: #DDB892; font-weight: bold; font-size: 12px; border-radius: 14px; cursor: pointer; transition: all 0.2s;">📁 Or Upload Card Photo</button>
      <button onclick="stopRealCameraScan()" style="padding: 12px 20px; background: #35251C; border: none; color: #FAF6F0; font-weight: bold; font-size: 12px; border-radius: 14px; cursor: pointer;">Cancel</button>
      <input type="file" id="card-image-file" accept="image/*" style="display: none;" onchange="handleHtmlCardUpload(event)">
    </div>

    <div id="scan-feedback" style="margin-top: 12px; font-size: 12px; color: #34d399; font-weight: bold; display: none;">
      ✓ Scanned! Authenticating with College Records...
    </div>
  </div>

  <script>
    let activeCameraStream = null;
    let cameraAnimationId = null;
    let nativeBarcodeDetector = null;

    if ('BarcodeDetector' in window) {
      try {
        nativeBarcodeDetector = new BarcodeDetector({
          formats: ['qr_code', 'code_128', 'code_39', 'ean_13', 'upc_a', 'data_matrix']
        });
      } catch(e) {}
    }

    window.startRealCameraScan = async function() {
      const modal = document.getElementById('real-camera-modal');
      const video = document.getElementById('live-camera-video');
      const feedback = document.getElementById('scan-feedback');
      feedback.style.display = 'none';
      modal.style.display = 'flex';

      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 } }
        });
        activeCameraStream = stream;
        video.srcObject = stream;
        await video.play();

        const detectLoop = async () => {
          if (!activeCameraStream) return;
          if (video.readyState === video.HAVE_ENOUGH_DATA && nativeBarcodeDetector) {
            try {
              const codes = await nativeBarcodeDetector.detect(video);
              if (codes && codes.length > 0) {
                onCardDecoded(codes[0].rawValue);
                return;
              }
            } catch(e) {}
          }
          cameraAnimationId = requestAnimationFrame(detectLoop);
        };
        cameraAnimationId = requestAnimationFrame(detectLoop);
      } catch(err) {
        alert("Camera permission denied or camera not found: " + err.message + "\nYou can use 'Upload Card Photo' to select a photo of your card.");
        stopRealCameraScan();
      }
    };

    window.stopRealCameraScan = function() {
      if (activeCameraStream) {
        activeCameraStream.getTracks().forEach(t => t.stop());
        activeCameraStream = null;
      }
      if (cameraAnimationId) {
        cancelAnimationFrame(cameraAnimationId);
        cameraAnimationId = null;
      }
      const modal = document.getElementById('real-camera-modal');
      if (modal) modal.style.display = 'none';
    };

    function onCardDecoded(codeStr) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        osc.frequency.value = 880;
        osc.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.15);
      } catch(e) {}

      document.getElementById('scan-feedback').style.display = 'block';
      setTimeout(() => {
        stopRealCameraScan();
        window.dispatchEvent(new CustomEvent('card_scanned_event', { detail: codeStr }));
      }, 500);
    }

    function handleHtmlCardUpload(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        const img = new Image();
        img.onload = async function() {
          if (nativeBarcodeDetector) {
            try {
              const codes = await nativeBarcodeDetector.detect(img);
              if (codes && codes.length > 0) {
                onCardDecoded(codes[0].rawValue);
                return;
              }
            } catch(err) {}
          }
          if (window.Html5Qrcode) {
            try {
              const html5Qr = new Html5Qrcode("camera-feed-box");
              const decoded = await html5Qr.scanFile(file, true);
              onCardDecoded(decoded);
              return;
            } catch(err) {}
          }
          alert("Could not detect barcode or QR code in photo. Please ensure it is sharp.");
        };
        img.src = evt.target.result;
      };
      reader.readAsDataURL(file);
    }
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
